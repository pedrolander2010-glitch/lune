<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <radialGradient id="vignetteIcon" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#181a24" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="chromeRimIcon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="25%" stop-color="#9aa0a6"/>
      <stop offset="50%" stop-color="#ffffff"/>
      <stop offset="75%" stop-color="#40454d"/>
      <stop offset="100%" stop-color="#e8eaed"/>
    </linearGradient>
    <linearGradient id="specularIcon" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#090a0f"/>
      <stop offset="40%" stop-color="#181a20"/>
      <stop offset="70%" stop-color="#606673"/>
      <stop offset="85%" stop-color="#d0d5dd"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
    <radialGradient id="obsidianBodyIcon" cx="50%" cy="38%" r="48%">
      <stop offset="0%" stop-color="#2a2e37"/>
      <stop offset="35%" stop-color="#121318"/>
      <stop offset="85%" stop-color="#050608"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>
    <radialGradient id="eyeDepthIcon" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#000000"/>
      <stop offset="70%" stop-color="#040507"/>
      <stop offset="100%" stop-color="#1e222b"/>
    </radialGradient>
    <linearGradient id="whiskerGradIcon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#474d58"/>
      <stop offset="50%" stop-color="#f8f9fa"/>
      <stop offset="100%" stop-color="#71767f"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" fill="url(#vignetteIcon)"/>

  <!-- Left Whiskers -->
  <path d="M 170 385 C 120 385, 60 395, 25 435 C 70 410, 125 400, 175 396 Z" fill="url(#whiskerGradIcon)" opacity="0.95"/>
  <path d="M 180 405 C 135 418, 75 440, 48 480 C 85 450, 140 430, 185 415 Z" fill="url(#whiskerGradIcon)" opacity="0.95"/>

  <!-- Right Whiskers -->
  <path d="M 342 385 C 392 385, 452 395, 487 435 C 442 410, 387 400, 337 396 Z" fill="url(#whiskerGradIcon)" opacity="0.95"/>
  <path d="M 332 405 C 377 418, 437 440, 464 480 C 427 450, 372 430, 327 415 Z" fill="url(#whiskerGradIcon)" opacity="0.95"/>

  <!-- Main Feline Head Outer Chrome Rim -->
  <path d="M 256 128
           C 295 128, 318 135, 345 152
           C 365 110, 410 40, 442 32
           C 448 85, 435 185, 420 230
           C 432 265, 435 305, 410 360
           C 385 415, 320 455, 275 464
           C 264 466, 256 462, 256 462
           C 256 462, 248 466, 237 464
           C 192 455, 127 415, 102 360
           C 77 305, 80 265, 92 230
           C 77 185, 64 85, 70 32
           C 102 40, 147 110, 167 152
           C 194 135, 217 128, 256 128 Z"
        fill="url(#obsidianBodyIcon)"
        stroke="url(#chromeRimIcon)"
        stroke-width="5"
        stroke-linejoin="round"/>

  <!-- Ear Inner Chrome Ridges -->
  <path d="M 85 58 C 118 80, 145 130, 160 175 C 142 165, 125 150, 110 130 C 96 112, 88 88, 85 58 Z" fill="url(#specularIcon)" opacity="0.85"/>
  <path d="M 427 58 C 394 80, 367 130, 352 175 C 370 165, 387 150, 402 130 C 416 112, 424 88, 427 58 Z" fill="url(#specularIcon)" opacity="0.85"/>

  <!-- Top Crown Specular Highlight -->
  <path d="M 200 145 C 225 136, 287 136, 312 145 C 290 152, 222 152, 200 145 Z" fill="#ffffff" opacity="0.8"/>
  <ellipse cx="256" cy="210" rx="90" ry="45" fill="url(#specularIcon)" opacity="0.25"/>

  <!-- Eyes -->
  <g>
    <path d="M 125 300 C 145 285, 185 285, 222 355 C 178 362, 142 342, 125 300 Z" fill="url(#eyeDepthIcon)" stroke="url(#chromeRimIcon)" stroke-width="3.5"/>
    <path d="M 130 300 C 152 287, 188 290, 218 350 C 192 320, 155 305, 130 300 Z" fill="#ffffff" opacity="0.75"/>
  </g>
  <g>
    <path d="M 387 300 C 367 285, 327 285, 290 355 C 334 362, 370 342, 387 300 Z" fill="url(#eyeDepthIcon)" stroke="url(#chromeRimIcon)" stroke-width="3.5"/>
    <path d="M 382 300 C 360 287, 324 290, 294 350 C 320 320, 357 305, 382 300 Z" fill="#ffffff" opacity="0.75"/>
  </g>

  <!-- Nose & Mouth -->
  <path d="M 256 348 L 244 380 L 268 380 Z" fill="url(#chromeRimIcon)" stroke="#ffffff" stroke-width="1.5"/>
  <path d="M 256 385 C 256 420, 252 455, 256 462" stroke="url(#chromeRimIcon)" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 235 464 C 248 468, 264 468, 277 464" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
</svg>
